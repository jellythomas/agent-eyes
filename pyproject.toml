[project]
name = "agent-eyes"
dynamic = ["version"]
description = "Native accessibility-tree computer use for AI agents across desktop applications and browsers"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Jelly Thomas"},
]
readme = "README.md"
keywords = ["mcp", "accessibility", "ai-agent", "computer-use", "automation", "screen-reader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Desktop Environment",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=1.28.1",
    "websockets>=12.0",
    "tomli>=2; python_version < '3.11'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-ApplicationServices",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
]
linux = [
    "python-xlib>=0.33",
]
windows = [
    "comtypes>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/jellythomas/agent-eyes"
Repository = "https://github.com/jellythomas/agent-eyes"
Issues = "https://github.com/jellythomas/agent-eyes/issues"

[project.scripts]
agent-eyes = "agent_eyes.cli:main"

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "agent_eyes.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_eyes = ["extension/**/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
