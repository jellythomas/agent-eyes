[project]
name = "agent-eyes"
dynamic = ["version"]
description = "Accessibility-tree vision for AI agents — see and interact with ANY application without screenshots"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jelly Thomas"},
]
readme = "README.md"
keywords = ["mcp", "accessibility", "ai-agent", "computer-use", "automation", "screen-reader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Desktop Environment",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=1.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-ApplicationServices",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
]
linux = [
    "python-xlib>=0.33",
]
windows = [
    "comtypes>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/jellythomas/agent-eyes"
Repository = "https://github.com/jellythomas/agent-eyes"
Issues = "https://github.com/jellythomas/agent-eyes/issues"

[project.scripts]
agent-eyes = "agent_eyes.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "agent_eyes.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_eyes = ["extension/**/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
