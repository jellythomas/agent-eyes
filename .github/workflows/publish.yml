name: Publish agent-eyes to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  full-gates:
    name: Full release gates
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs: full-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag and main ancestry
        shell: bash
        run: |
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          package_version="$(PYTHONPATH=src python -c 'import agent_eyes; print(agent_eyes.__version__)')"
          test "v${package_version}" = "$GITHUB_REF_NAME"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
      - name: Install pinned build tools
        run: >-
          python -m pip install --upgrade pip
          setuptools==83.0.0
          build==1.5.0
          pytest==9.0.2
          twine==6.2.0
      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build and compare independent distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          build_root="$(mktemp -d)"
          trap 'rm -rf "$build_root"' EXIT
          mkdir -p \
            "$build_root/source-a" \
            "$build_root/source-b" \
            "$build_root/dist-a" \
            "$build_root/dist-b" \
            "$build_root/from-sdist" \
            "$build_root/dist-from-sdist"

          git archive --format=tar HEAD | tar -xf - -C "$build_root/source-a"
          git archive --format=tar HEAD | tar -xf - -C "$build_root/source-b"
          python -m build --no-isolation --outdir "$build_root/dist-a" "$build_root/source-a"
          python -m build --no-isolation --outdir "$build_root/dist-b" "$build_root/source-b"

          wheels_a=("$build_root/dist-a"/*.whl)
          wheels_b=("$build_root/dist-b"/*.whl)
          sdists_a=("$build_root/dist-a"/*.tar.gz)
          sdists_b=("$build_root/dist-b"/*.tar.gz)
          test "${#wheels_a[@]}" -eq 1
          test "${#wheels_b[@]}" -eq 1
          test "${#sdists_a[@]}" -eq 1
          test "${#sdists_b[@]}" -eq 1

          python scripts/normalize_sdist.py "${sdists_a[0]}"
          python scripts/normalize_sdist.py "${sdists_b[0]}"
          test "$(basename "${wheels_a[0]}")" = "$(basename "${wheels_b[0]}")"
          test "$(basename "${sdists_a[0]}")" = "$(basename "${sdists_b[0]}")"
          cmp "${wheels_a[0]}" "${wheels_b[0]}"
          cmp "${sdists_a[0]}" "${sdists_b[0]}"

          tar -xzf "${sdists_a[0]}" -C "$build_root/from-sdist"
          sdist_sources=("$build_root/from-sdist"/*)
          test "${#sdist_sources[@]}" -eq 1
          test -d "${sdist_sources[0]}"
          test -f "${sdist_sources[0]}/scripts/normalize_sdist.py"
          python -m pytest -q "${sdist_sources[0]}/tests/test_normalize_sdist.py"
          python -m build \
            --no-isolation \
            --wheel \
            --outdir "$build_root/dist-from-sdist" \
            "${sdist_sources[0]}"
          rebuilt_wheels=("$build_root/dist-from-sdist"/*.whl)
          test "${#rebuilt_wheels[@]}" -eq 1
          test "$(basename "${wheels_a[0]}")" = "$(basename "${rebuilt_wheels[0]}")"
          cmp "${wheels_a[0]}" "${rebuilt_wheels[0]}"

          test ! -e dist
          mkdir dist
          cp "${wheels_a[0]}" "${sdists_a[0]}" dist/
          python - <<'PY'
          from hashlib import file_digest
          from pathlib import Path

          for artifact in sorted(Path("dist").iterdir()):
              with artifact.open("rb") as stream:
                  digest = file_digest(stream, "sha256").hexdigest()
              print(f"{digest}  {artifact}")
          PY
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Smoke-test the exact release wheel in isolation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install --upgrade pip
          "$smoke_root/venv/bin/python" -m pip install "${wheels[0]}"
          env -u PYTHONHOME -u PYTHONPATH PYTHONNOUSERSITE=1 \
            "$smoke_root/venv/bin/python" scripts/smoke_installed_artifact.py \
            --executable "$smoke_root/venv/bin/agent-eyes" \
            --expected-version "$PACKAGE_VERSION"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-eyes
    permissions:
      id-token: write  # Trusted publishing (no API token needed)
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
