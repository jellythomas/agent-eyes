name: Test agent-eyes

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Static and dependency gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install --upgrade pip uv ruff bandit pip-audit
      - name: Lint source and benchmarks
        run: ruff check src benchmarks
      - name: Reject medium and high static-security findings
        run: bandit -r src -q -ll
      - name: Audit the locked dependency set
        shell: bash
        run: |
          audit_requirements="$(mktemp)"
          uv export --frozen --all-groups --no-emit-project --no-hashes --format requirements-txt --output-file "$audit_requirements"
          pip-audit --no-deps --disable-pip --requirement "$audit_requirements"

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip build pytest && python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run tests
        run: >-
          python -m pytest -q
          -o faulthandler_timeout=60
          -o faulthandler_exit_on_timeout=true

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build distributions from a stable epoch
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Smoke-test the built wheel in isolation
        shell: bash
        run: |
          python -m venv /tmp/agent-eyes-artifact
          /tmp/agent-eyes-artifact/bin/python -m pip install dist/*.whl
          /tmp/agent-eyes-artifact/bin/agent-eyes --version
          /tmp/agent-eyes-artifact/bin/agent-eyes --help >/dev/null

  stress:
    name: Stress / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run deterministic stress gates
        run: python benchmarks/stress_concurrency.py
